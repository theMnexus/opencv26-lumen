[project]
name = "lumen"
version = "0.1.0"
description = "theMnexus Lumen: OpenCV 5 agent that groups, aligns, merges and checks real-estate bracket photos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.110",
    "fastapi>=0.143.0",
    "mangum>=0.22.0",
    "numpy>=2.5.3",
    "opencv-contrib-python-headless==5.0.0.93",
    "pillow>=12.3.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]

[project.scripts]
lumen-mcp = "lumen.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "exifread>=3.5.1",
    "httpx>=0.28.1",
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "rawpy>=0.27.1",
]
